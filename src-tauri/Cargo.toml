[package]
name = "framewise"
version = "0.1.21"
description = "Local video metadata inspector"
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "framewise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
trash = "5.2.9"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
tauri-plugin-opener = "2"
caseless = "0.2.2"
unicode-normalization = "0.1.25"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.5.0"
